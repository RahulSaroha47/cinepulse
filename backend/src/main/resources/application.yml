spring:
  application:
    name: cinepulse

  datasource:
    url: jdbc:mysql://localhost:3307/cinepulse
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080